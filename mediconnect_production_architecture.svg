<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 760" width="800" height="760" role="img" aria-labelledby="t d">
<title id="t">Production architecture for MediConnect</title>
<desc id="d">Mobile and web clients connect through a CDN, WAF and API gateway with Keycloak identity to a core modular monolith and four extracted services (donor geo, notifications, AI gateway, documents). Kafka and Temporal handle events and workflows, backed by PostgreSQL, Redis, object storage and an audit store, with external SMS, payment, LLM and hospital providers.</desc>
<style>
  text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .node rect { stroke-width: 1px; }
  .node .title { font-size: 14px; font-weight: 600; text-anchor: middle; }
  .node .sub { font-size: 12px; text-anchor: middle; }
  .edge { stroke-width: 1.5px; fill: none; }
  .band { font-size: 10px; letter-spacing: 0.08em; font-weight: 600; }
  .legend { font-size: 12px; }
  .canvas { fill: #FFFFFF; }
  .build rect { fill: #EEEDFE; stroke: #534AB7; }
  .build .title { fill: #3C3489; }
  .build .sub { fill: #534AB7; }
  .infra rect { fill: #FCFCFB; stroke: #D6D5D1; }
  .infra .title { fill: #0B0B0B; }
  .infra .sub { fill: #52514E; }
  .ext rect { fill: #E1F5EE; stroke: #0F6E56; }
  .ext .title { fill: #085041; }
  .ext .sub { fill: #0F6E56; }
  .edge, .arrowhead { stroke: #898781; }
  .band, .legend { fill: #52514E; }
  @media (prefers-color-scheme: dark) {
  .canvas { fill: #1C1C1B; }
  .build rect { fill: #1E1A4D; stroke: #C9C5F7; }
  .build .title { fill: #EEEDFE; }
  .build .sub { fill: #C9C5F7; }
  .infra rect { fill: #3A3936; stroke: #898781; }
  .infra .title { fill: #F1F0EC; }
  .infra .sub { fill: #D6D5D1; }
  .ext rect { fill: #0A2E26; stroke: #A8E3CF; }
  .ext .title { fill: #E1F5EE; }
  .ext .sub { fill: #A8E3CF; }
  .edge, .arrowhead { stroke: #898781; }
  .band, .legend { fill: #D6D5D1; }
  }
</style>
